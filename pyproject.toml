[project]
name = "project-4"
version = "0.1.0"
description = "A pet project as a part of the university course 'Advanced Programming for Linguists'."
readme = "README.md"
authors = [
    { name = "Морева Дарья", email = "doshirak14@inbox.ru" },
    { name = "Торгашева Ксения"},
    { name = "Крапивцева Анна"}
]
requires-python = "==3.13.17"
dependencies = []

[project.scripts]
project-4 = "project_4:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
